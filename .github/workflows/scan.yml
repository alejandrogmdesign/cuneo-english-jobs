name: Scan school websites

on:
  schedule:
    # Every 3 hours from 06:20 to 21:20 Italian winter time (UTC+1), every day.
    - cron: "20 5-20/3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["docs/**", "scanner/**", "data/schools.json", "data/extra_sources.json", ".github/workflows/**"]

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the school websites
        env:
          SOURCES_API: ${{ vars.SOURCES_API }}
          SCAN_KEY: ${{ secrets.SCAN_KEY }}
        run: python3 scanner/scan.py

      - name: Save the new list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json data/state.json
          [ -f data/her_sites_backup.json ] && git add data/her_sites_backup.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update job list"
            # Someone may have pushed while the scan ran: rebase onto it (the scan's files win) and retry.
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 10
            done
            exit 1
          fi

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
